server:
  port: 8080

spring:
  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Email Configuration
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:khuswanthraojadav@gmail.com}
    password: ${EMAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Custom Project Configurations
portfolio:
  email:
    from: ${EMAIL_FROM:khuswanthraojadav@gmail.com}
    to: ${EMAIL_TO:khuswanthraojadav@gmail.com}
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}

# Springdoc OpenAPI (Swagger) Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    redirect-url-use-relative-path: true

